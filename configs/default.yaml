# DeepInfant V2 Default Configuration
system:
  project_name: "DeepInfant V2"
  version: "2.0.0"
  device: "cuda" # 'cuda' or 'cpu'
  seed: 42

audio:
  sample_rate: 16000
  channels: 1 # mono
  target_duration_sec: 4.0 # canonical audio window length
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  f_min: 50.0
  f_max: 8000.0
  normalize_amplitude: true
  top_db: 80.0

augmentation:
  enabled: true
  pitch_shift_range: [-2, 2] # semitones
  time_stretch_range: [0.9, 1.1]
  noise_level: 0.005
  gain_range: [0.8, 1.2]
  spec_augment:
    freq_mask_param: 15
    time_mask_param: 35

classes:
  - belly_pain
  - burping
  - cold_hot
  - discomfort
  - hungry
  - lonely
  - scared
  - tired
  - unknown

model:
  backbone: "cnn_lstm" # options: cnn_lstm, resnet18_lstm, resnet34_lstm, mfcc_baseline
  in_channels: 1
  cnn_filters: [32, 64, 128, 256]
  lstm_hidden_dim: 128
  lstm_layers: 2
  bidirectional: true
  dropout: 0.3
  num_classes: 9

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: "weighted_cross_entropy" # options: cross_entropy, weighted_cross_entropy, focal_loss
  focal_gamma: 2.0
  optimizer: "adam"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 8

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  split_by_subject: true # Prevent data leakage by splitting on baby_id

inference:
  confidence_threshold: 0.45 # Predictions below this become 'unknown'
  smoothing_alpha: 0.35 # Temporal exponential smoothing weight
  window_sec: 0.975
  stride_sec: 0.25
